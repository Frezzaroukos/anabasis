[package]
name = "anabasis-api"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "anabasis-api"
path = "src/main.rs"

[lib]
name = "anabasis_api"
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
argon2 = "0.6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
base64 = "0.23"
# rustls αντί για system OpenSSL — μηδενικό extra σύστημα-dependency στο deploy
# (systemd unit + Docker), μόνο για το Google token/userinfo exchange.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
