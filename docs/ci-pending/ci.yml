name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: types · lint · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ο ίδιος έλεγχος που τρέχει τοπικά, με την ίδια σειρά. Το `tsc -b`
      # (μέσα στο build) έχει πιάσει λάθη που το `tsc --noEmit` δεν έπιανε,
      # γι' αυτό το build είναι μέρος του CI και όχι μόνο του deploy.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
