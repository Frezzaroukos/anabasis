<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- user-scalable=no αφαιρέθηκε: μπλοκάρει το pinch-zoom, WCAG 1.4.4/1.4.10
         παραβίαση — χαμηλής όρασης χρήστες πρέπει να μπορούν να μεγεθύνουν. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Ταιριάζει με το app background (Altitude Violet bg-base) ώστε το status bar να μη «κόβει» στο iOS/Android -->
    <meta name="theme-color" content="#101013" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anabasis" />
    <meta
      name="description"
      content="Anabasis — weighted calisthenics & skill progression tracker. Offline-first, δίγλωσσο, τα δεδομένα μένουν στη συσκευή σου."
    />
    <title>Anabasis · weighted calisthenics &amp; skill progression</title>

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anabasis" />
    <meta property="og:title" content="Anabasis — weighted calisthenics &amp; skill progression" />
    <meta
      property="og:description"
      content="Κάθε skill είναι μια σκάλα. Offline-first tracker για weighted calisthenics και skill progressions."
    />
    <meta property="og:url" content="https://anabasis.axonos.dev" />
    <meta property="og:image" content="https://anabasis.axonos.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
